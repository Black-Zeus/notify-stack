# =============================================================================
# NOTIFY-STACK - Email Providers Configuration (Fase 3)
# =============================================================================
# Proveedores SMTP + API (SES, SendGrid, Mailgun)
# Credenciales sensibles en secrets.env

# =============================================================================
# DEVELOPMENT PROVIDERS
# =============================================================================

mailpit:
  type: "smtp"
  name: "MailPit Development"
  description: "Capturador de correos para desarrollo y testing"
  
  host: "mailpit"
  port: 1025
  username: ""
  password: ""
  
  use_tls: false
  use_ssl: false
  verify_certificate: false
  
  from_email: "dev@notify-system.local"
  from_name: "Notify Dev System"
  reply_to: "dev@notify-system.local"
  return_path: "dev@notify-system.local"
  
  timeout: 15
  max_recipients_per_message: 100
  max_messages_per_hour: 1000
  max_attachment_size: 25165824
  
  priority: "high"
  category: "development"
  enabled: true
  
  features:
    html_support: true
    attachments: true
    tracking: false
    
  retry:
    max_attempts: 1
    backoff_factor: 1

# =============================================================================
# SMTP PROVIDERS
# =============================================================================

smtp_primary:
  type: "smtp"
  name: "Gmail SMTP Primary"
  description: "Proveedor principal SMTP"
  
  host: "${SMTP_GMAIL_HOST}"
  port: "${SMTP_GMAIL_PORT}"
  username: "${SMTP_GMAIL_USERNAME}"
  password: "${SMTP_GMAIL_PASSWORD}"
  
  use_tls: true
  use_ssl: false
  verify_certificate: true
  
  from_email: "${SMTP_GMAIL_USERNAME}"
  from_name: "${SMTP_GMAIL_FROM_NAME}"
  reply_to: "${SMTP_GMAIL_USERNAME}"
  return_path: "${SMTP_GMAIL_USERNAME}"
  
  timeout: 30
  max_recipients_per_message: 100
  max_messages_per_hour: 500
  max_attachment_size: 25165824
  
  priority: "high"
  category: "transactional"
  enabled: false
  
  features:
    html_support: true
    attachments: true
    tracking: false
    
  retry:
    max_attempts: 3
    backoff_factor: 2
    initial_delay: 60

smtp_secondary:
  type: "smtp"
  name: "Outlook SMTP Secondary"
  description: "Proveedor de respaldo para failover"
  
  host: "${SMTP_OUTLOOK_HOST}"
  port: "${SMTP_OUTLOOK_PORT}"
  username: "${SMTP_OUTLOOK_USERNAME}"
  password: "${SMTP_OUTLOOK_PASSWORD}"
  
  use_tls: true
  use_ssl: false
  
  from_email: "${SMTP_OUTLOOK_USERNAME}"
  from_name: "Notify System Backup"
  
  timeout: 30
  max_recipients_per_message: 50
  max_messages_per_hour: 300
  
  priority: "medium"
  category: "backup"
  enabled: false
  
  features:
    html_support: true
    attachments: true
    tracking: false
    
  retry:
    max_attempts: 3
    backoff_factor: 2

smtp_bulk:
  type: "smtp"
  name: "Custom SMTP Bulk"
  description: "Proveedor optimizado para envíos masivos"
  
  host: "${SMTP_CUSTOM_HOST}"
  port: "${SMTP_CUSTOM_PORT}"
  username: "${SMTP_CUSTOM_USERNAME}"
  password: "${SMTP_CUSTOM_PASSWORD}"
  
  use_tls: true
  use_ssl: false
  
  from_email: "${SMTP_CUSTOM_USERNAME}"
  from_name: "Newsletter System"
  
  timeout: 45
  max_recipients_per_message: 500
  max_messages_per_hour: 2000
  
  priority: "medium"
  category: "bulk"
  enabled: false
  
  features:
    html_support: true
    attachments: false
    tracking: false
    
  retry:
    max_attempts: 3
    backoff_factor: 2

# =============================================================================
# API PROVIDERS - NUEVO FASE 3
# =============================================================================

# Amazon SES
api_ses:
  type: "api"
  provider_type: "ses"
  name: "Amazon SES"
  description: "AWS Simple Email Service - Alta capacidad"
  
  endpoint: "https://email.${AWS_REGION}.amazonaws.com"
  api_version: "2010-12-01"
  aws_region: "${AWS_REGION}"
  
  access_key_id: "${AWS_SES_ACCESS_KEY}"
  secret_access_key: "${AWS_SES_SECRET_KEY}"
  
  from_email: "${SES_FROM_EMAIL}"
  from_name: "${SES_FROM_NAME}"
  configuration_set: "${SES_CONFIG_SET}"
  
  timeout: 30
  max_recipients_per_message: 50
  max_messages_per_second: 14
  max_attachment_size: 10485760
  
  priority: "high"
  category: "transactional"
  enabled: false
  
  features:
    html_support: true
    attachments: true
    tracking: true
    analytics: true
    bounce_handling: true
    
  retry:
    max_attempts: 3
    backoff_factor: 2
    initial_delay: 30
  
  cost:
    per_1000_emails: 0.10
    per_gb_attachment: 0.12

# SendGrid
api_sendgrid:
  type: "api"
  provider_type: "sendgrid"
  name: "SendGrid API"
  description: "SendGrid - Marketing y transaccional"
  
  endpoint: "https://api.sendgrid.com/v3/mail/send"
  api_key: "${SENDGRID_API_KEY}"
  
  from_email: "${SENDGRID_FROM_EMAIL}"
  from_name: "${SENDGRID_FROM_NAME}"
  reply_to: "${SENDGRID_REPLY_TO}"
  
  timeout: 30
  max_recipients_per_message: 1000
  max_messages_per_second: 100
  max_attachment_size: 30720000
  
  priority: "medium"
  category: "bulk"
  enabled: false
  
  features:
    html_support: true
    attachments: true
    tracking: true
    analytics: true
    templates: true
    
  tracking_settings:
    click_tracking: true
    open_tracking: true
    subscription_tracking: false
    
  retry:
    max_attempts: 3
    backoff_factor: 2
    initial_delay: 60
  
  cost:
    per_1000_emails: 0.80

# Mailgun
api_mailgun:
  type: "api"
  provider_type: "mailgun"
  name: "Mailgun API"
  description: "Mailgun - Transaccional confiable"
  
  endpoint: "https://api.mailgun.net/v3"
  api_key: "${MAILGUN_API_KEY}"
  domain: "${MAILGUN_DOMAIN}"
  
  from_email: "noreply@${MAILGUN_DOMAIN}"
  from_name: "${MAILGUN_FROM_NAME}"
  
  timeout: 30
  max_recipients_per_message: 1000
  max_messages_per_hour: 10000
  max_attachment_size: 25165824
  
  priority: "medium"
  category: "transactional"
  enabled: false
  
  features:
    html_support: true
    attachments: true
    tracking: true
    analytics: true
    templates: true
    
  retry:
    max_attempts: 3
    backoff_factor: 2
    initial_delay: 45
  
  cost:
    per_1000_emails: 0.80

# API Genérico
api_generic:
  type: "api"
  provider_type: "generic"
  name: "Generic HTTP API"
  description: "Adaptador para APIs personalizadas"
  
  endpoint: "${CUSTOM_API_ENDPOINT}"
  api_key: "${CUSTOM_API_KEY}"
  method: "POST"
  
  headers:
    Content-Type: "application/json"
    X-API-Key: "${CUSTOM_API_KEY}"
  
  field_mapping:
    to: "recipient"
    subject: "email_subject"
    body_html: "html_body"
    body_text: "text_body"
  
  timeout: 30
  priority: "low"
  enabled: false
  
  retry:
    max_attempts: 2
    backoff_factor: 1

# =============================================================================
# PROVIDER GROUPS - FASE 3
# =============================================================================

provider_groups:
  development:
    providers:
      - name: "mailpit"
        weight: 100
    load_balancing: "single"
    health_check: false
    
  transactional:
    providers:
      - name: "smtp_primary"
        weight: 70
      - name: "api_sendgrid"
        weight: 30
    load_balancing: "weighted_round_robin"
    health_check: true
    
  bulk:
    providers:
      - name: "smtp_bulk"
        weight: 60
      - name: "api_mailgun"
        weight: 40
    load_balancing: "round_robin"
    health_check: true
    
  backup:
    providers:
      - name: "smtp_secondary"
        weight: 50
      - name: "api_ses"
        weight: 50
    load_balancing: "failover"
    health_check: true

# =============================================================================
# ROUTING Y FALLBACK - FASE 3
# =============================================================================

routing:
  default_strategy: "priority"
  enable_fallback: true
  
  fallback_chain:
    - "api_ses"
    - "api_sendgrid"
    - "api_mailgun"
    - "smtp_primary"
  
  by_category:
    transactional:
      preferred: ["api_ses", "smtp_primary"]
      max_cost_per_1000: 0.50
    
    bulk:
      preferred: ["api_sendgrid", "api_mailgun"]
      max_cost_per_1000: 1.00
    
    development:
      preferred: ["mailpit"]
      force_provider: true
  
  intelligent_routing:
    enabled: true
    factors:
      cost_weight: 0.3
      speed_weight: 0.4
      reliability_weight: 0.3

# =============================================================================
# HEALTH MONITORING - FASE 3
# =============================================================================

health_monitoring:
  check_intervals:
    fast_check: 60
    full_check: 300
    
  health_criteria:
    max_response_time: 5.0
    max_error_rate: 5.0
    min_success_rate: 95.0
    
  auto_actions:
    disable_unhealthy: true
    alert_on_failure: true
    
  alerts:
    webhook_url: "${ALERT_WEBHOOK_URL}"
    email_alerts: ["admin@yourcompany.com"]

# =============================================================================
# COST OPTIMIZATION - FASE 3
# =============================================================================

cost_optimization:
  cost_aware_routing: true
  
  provider_costs:
    mailpit: 0
    smtp_primary: 2
    smtp_secondary: 2
    smtp_bulk: 1
    api_sendgrid: 4
    api_ses: 3
    api_mailgun: 4
    
  cost_limits:
    max_daily_cost: 50.0
    alert_threshold: 30.0
    
  auto_optimizations:
    prefer_cheaper_for_bulk: true
    route_off_hours_to_cheaper: true

# =============================================================================
# REGIONAL SETTINGS - FASE 3
# =============================================================================

regional_settings:
  us:
    preferred_providers: ["api_sendgrid", "smtp_primary"]
    compliance_requirements: ["can_spam"]
    
  eu:
    preferred_providers: ["api_mailgun", "smtp_secondary"]
    compliance_requirements: ["gdpr"]
    data_residency: "eu"
    
  apac:
    preferred_providers: ["api_ses", "smtp_primary"]
    compliance_requirements: ["local_privacy_laws"]

# =============================================================================
# DEVELOPMENT & TESTING - FASE 3
# =============================================================================

development:
  default_provider: "mailpit"
  
  email_interception:
    enabled: true
    redirect_to: ["dev@yourcompany.com"]
    
  failure_simulation:
    enabled: true
    failure_rate: 0.1
    
  debug_logging: true

# =============================================================================
# STATISTICS - FASE 3
# =============================================================================

statistics:
  tracked_metrics:
    - "messages_sent"
    - "messages_failed"
    - "response_time"
    - "cost_per_message"
    - "delivery_rate"
    
  retention:
    hourly_data: 48
    daily_data: 90
    monthly_data: 24
    
  metric_alerts:
    high_failure_rate:
      threshold: 10.0
      window: 300
    slow_response:
      threshold: 10.0
      window: 600

# =============================================================================
# GLOBAL SETTINGS
# =============================================================================

global:
  default_max_retries: 3
  default_retry_backoff: 2
  default_timeout: 30
  connection_timeout: 10
  max_recipients_global: 100
  max_attachment_size_global: 25165824